<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Live Signal Terminal</title>
  <!-- TradingView Lightweight Charts Canvas -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg-dark: #080b11;
      --panel-bg: #121722;
      --border-color: #1e2638;
      --text-main: #f0f3f9;
      --text-muted: #707a8a;
      --buy-green: #00c076;
      --sell-red: #ff3b5c;
      --accent-blue: #2962ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      height: 52px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--buy-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--buy-green);
    }

    .pair-selector {
      display: flex;
      gap: 8px;
    }

    .pair-btn {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pair-btn.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }

    /* Main Fullscreen Workspace */
    .workspace {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 52px);
    }

    #chart-container {
      width: 100%;
      height: 100%;
    }

    /* Live Signal Info Box */
    .signal-banner {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(18, 23, 34, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .signal-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .signal-badge {
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .badge-buy {
      background: rgba(0, 192, 118, 0.2);
      color: var(--buy-green);
      border: 1px solid var(--buy-green);
    }

    .badge-sell {
      background: rgba(255, 59, 92, 0.2);
      color: var(--sell-red);
      border: 1px solid var(--sell-red);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <div class="live-dot"></div>
      <span>ZOQIRA LIVE SIGNAL ENGINE</span>
    </div>

    <div class="pair-selector">
      <button class="pair-btn active" onclick="switchPair('BTCUSDT', this)">BTC / USDT</button>
      <button class="pair-btn" onclick="switchPair('ETHUSDT', this)">ETH / USDT</button>
      <button class="pair-btn" onclick="switchPair('SOLUSDT', this)">SOL / USDT</button>
    </div>
  </header>

  <!-- Fullscreen Chart Workspace -->
  <div class="workspace">
    <div class="signal-banner">
      <div>
        <div class="signal-title">EMA CROSSOVER ALGO</div>
        <div id="pair-display" style="font-weight: 800; font-size: 0.95rem;">BTC/USDT</div>
      </div>
      <div id="latest-signal" class="signal-badge badge-buy">CALCULATING...</div>
    </div>

    <!-- Chart Canvas Target -->
    <div id="chart-container"></div>
  </div>

  <script>
    let chart, candleSeries, ws;
    let candlesData = [];
    let currentPair = 'BTCUSDT';

    function initChart() {
      const container = document.getElementById('chart-container');

      chart = LightweightCharts.createChart(container, {
        layout: { background: { color: '#080b11' }, textColor: '#707a8a' },
        grid: { vertLines: { color: '#121722' }, horzLines: { color: '#121722' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: { timeVisible: true, secondsVisible: true },
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#00c076',
        downColor: '#ff3b5c',
        borderVisible: false,
        wickUpColor: '#00c076',
        wickDownColor: '#ff3b5c',
      });

      loadLiveData(currentPair);

      window.addEventListener('resize', () => {
        chart.resize(container.clientWidth, container.clientHeight);
      });
    }

    // Exponential Moving Average Calculation
    function calculateEMA(candles, period) {
      const k = 2 / (period + 1);
      let ema = [];
      let prevEma = candles[0].close;

      for (let i = 0; i < candles.length; i++) {
        if (i < period - 1) {
          ema.push(null);
        } else if (i === period - 1) {
          let sum = 0;
          for (let j = 0; j < period; j++) sum += candles[j].close;
          prevEma = sum / period;
          ema.push(prevEma);
        } else {
          let currentEma = (candles[i].close * k) + (prevEma * (1 - k));
          ema.push(currentEma);
          prevEma = currentEma;
        }
      }
      return ema;
    }

    // Process Crossovers and Render Buy/Sell Markers on Chart
    function updateSignalsAndMarkers() {
      if (candlesData.length < 30) return;

      const emaFast = calculateEMA(candlesData, 9);
      const emaSlow = calculateEMA(candlesData, 21);

      let markers = [];
      let currentSignal = 'NEUTRAL';

      for (let i = 22; i < candlesData.length; i++) {
        let prevFast = emaFast[i - 1];
        let prevSlow = emaSlow[i - 1];
        let currFast = emaFast[i];
        let currSlow = emaSlow[i];

        if (prevFast && prevSlow && currFast && currSlow) {
          // Bullish Cross -> BUY Signal
          if (prevFast <= prevSlow && currFast > currSlow) {
            markers.push({
              time: candlesData[i].time,
              position: 'belowBar',
              color: '#00c076',
              shape: 'arrowUp',
              text: 'BUY'
            });
            currentSignal = 'BUY';
          } 
          // Bearish Cross -> SELL Signal
          else if (prevFast >= prevSlow && currFast < currSlow) {
            markers.push({
              time: candlesData[i].time,
              position: 'aboveBar',
              color: '#ff3b5c',
              shape: 'arrowDown',
              text: 'SELL'
            });
            currentSignal = 'SELL';
          }
        }
      }

      candleSeries.setMarkers(markers);

      // Update Top Overlay Badge
      const badge = document.getElementById('latest-signal');
      if (currentSignal === 'BUY') {
        badge.innerText = 'BUY SIGNAL ACTIVE';
        badge.className = 'signal-badge badge-buy';
      } else if (currentSignal === 'SELL') {
        badge.innerText = 'SELL SIGNAL ACTIVE';
        badge.className = 'signal-badge badge-sell';
      }
    }

    // Load Live Market History + Open WebSocket Connection
    async function loadLiveData(symbol) {
      if (ws) ws.close();

      try {
        // Fetch real historical candles from Binance REST API
        const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=200`);
        const data = await response.json();

        candlesData = data.map(d => ({
          time: Math.floor(d[0] / 1000),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));

        candleSeries.setData(candlesData);
        updateSignalsAndMarkers();

        // Connect to Real-Time Binance WebSocket Stream
        const streamSymbol = symbol.toLowerCase();
        ws = new WebSocket(`wss://stream.binance.com:9443/ws/${streamSymbol}@kline_1m`);

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          const k = msg.k;

          const liveCandle = {
            time: Math.floor(k.t / 1000),
            open: parseFloat(k.o),
            high: parseFloat(k.h),
            low: parseFloat(k.l),
            close: parseFloat(k.c)
          };

          // Check if candle updated or new candle opened
          const lastCandleIndex = candlesData.length - 1;
          if (lastCandleIndex >= 0 && candlesData[lastCandleIndex].time === liveCandle.time) {
            candlesData[lastCandleIndex] = liveCandle;
          } else {
            candlesData.push(liveCandle);
          }

          // Update chart and recalculate signal arrows live
          candleSeries.update(liveCandle);
          updateSignalsAndMarkers();
        };

      } catch (err) {
        console.error("Error loading live data:", err);
      }
    }

    // Switch Pair Logic
    function switchPair(pair, btn) {
      document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      currentPair = pair;
      document.getElementById('pair-display').innerText = pair.replace('USDT', '/USDT');
      document.getElementById('latest-signal').innerText = 'LOADING...';

      loadLiveData(pair);
    }

    document.addEventListener("DOMContentLoaded", initChart);
  </script>
</body>
</html>
