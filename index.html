<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Trading Terminal | XAUUSD & BTCUSDT</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --panel-bg: #151924;
      --border-color: #2a2e3d;
      --text-main: #d1d4dc;
      --text-muted: #787b86;
      --accent-green: #089981;
      --accent-red: #f23645;
      --accent-blue: #2962ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 56px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .asset-selector {
      display: flex;
      gap: 8px;
      background: var(--bg-color);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background-color: var(--accent-blue);
      color: #fff;
    }

    /* Ticker Tape Bar */
    .ticker-bar {
      height: 46px;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }

    /* Main Chart Area */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 102px);
    }

    .chart-container {
      width: 100%;
      height: 100%;
      display: none;
    }

    .chart-container.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="status-dot"></div>
      <span>PRO TERMINAL</span>
    </div>

    <div class="asset-selector">
      <button class="tab-btn active" onclick="switchAsset('XAUUSD')">XAU / USD</button>
      <button class="tab-btn" onclick="switchAsset('BTCUSDT')">BTC / USDT</button>
    </div>
  </header>

  <!-- Live Ticker Bar -->
  <div class="ticker-bar">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "OANDA:XAUUSD", "title": "Gold (XAU/USD)" },
          { "proName": "BINANCE:BTCUSDT", "title": "Bitcoin (BTC/USDT)" },
          { "proName": "FX_IDC:EURUSD", "title": "EUR/USD" },
          { "proName": "INDEX:DXY", "title": "US Dollar Index" }
        ],
        "showSymbolLogo": true,
        "colorTheme": "dark",
        "isTransparent": true,
        "displayMode": "adaptive",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- Chart Workspace -->
  <main>
    <!-- XAUUSD Container -->
    <div id="chart-XAUUSD" class="chart-container active">
      <div class="tradingview-widget-container" style="height:100%;width:100%;">
        <div id="tradingview_xauusd" style="height:100%;width:100%;"></div>
      </div>
    </div>

    <!-- BTCUSDT Container -->
    <div id="chart-BTCUSDT" class="chart-container">
      <div class="tradingview-widget-container" style="height:100%;width:100%;">
        <div id="tradingview_btcusdt" style="height:100%;width:100%;"></div>
      </div>
    </div>
  </main>

  <!-- TradingView Library Load -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    // Track initialized widgets
    const widgets = {};

    function initChart(symbol, containerId) {
      if (widgets[containerId]) return;

      widgets[containerId] = new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "60",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#151924",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "container_id": containerId,
        "studies": [
          "STD;EMA",
          "STD;RSI",
          "STD;MACD"
        ]
      });
    }

    // Initialize initial default chart (XAUUSD)
    document.addEventListener("DOMContentLoaded", () => {
      initChart("OANDA:XAUUSD", "tradingview_xauusd");
    });

    // Switch Tab Logic
    function switchAsset(asset) {
      // Update Tab Styles
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Update Active Chart
      document.querySelectorAll('.chart-container').forEach(c => c.classList.remove('active'));

      if (asset === 'XAUUSD') {
        document.getElementById('chart-XAUUSD').classList.add('active');
        initChart("OANDA:XAUUSD", "tradingview_xauusd");
      } else if (asset === 'BTCUSDT') {
        document.getElementById('chart-BTCUSDT').classList.add('active');
        initChart("BINANCE:BTCUSDT", "tradingview_btcusdt");
      }
    }
  </script>
</body>
</html>
