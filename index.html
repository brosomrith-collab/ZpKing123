<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoqira Execution Terminal</title>
  <style>
    :root {
      --bg-dark: #090c10;
      --panel-dark: #131722;
      --border-color: #2a2e3d;
      --text-bright: #f0f3f9;
      --text-muted: #787b86;
      --accent-blue: #2962ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-bright);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: var(--panel-dark);
      border-bottom: 1px solid var(--border-color);
      padding: 0 20px;
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #089981;
      border-radius: 50%;
      box-shadow: 0 0 8px #089981;
    }

    .asset-tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-dark);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--accent-blue);
      color: #fff;
    }

    /* Workspace */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 52px);
    }

    .chart-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .chart-wrapper.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand">
      <div class="live-dot"></div>
      <span>ZOQIRA TERMINAL</span>
    </div>

    <div class="asset-tabs">
      <button class="tab-btn active" onclick="switchPair('XAUUSD', this)">XAU / USD</button>
      <button class="tab-btn" onclick="switchPair('BTCUSDT', this)">BTC / USDT</button>
    </div>
  </header>

  <!-- Fullscreen Chart Workspace -->
  <main>
    <!-- XAUUSD Section -->
    <div id="wrapper-XAUUSD" class="chart-wrapper active">
      <div id="tv_xauusd" style="height:100%;width:100%;"></div>
    </div>

    <!-- BTCUSDT Section -->
    <div id="wrapper-BTCUSDT" class="chart-wrapper">
      <div id="tv_btcusdt" style="height:100%;width:100%;"></div>
    </div>
  </main>

  <!-- TradingView Library -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    const activeCharts = {};

    function renderChart(symbol, elementId) {
      if (activeCharts[elementId]) return;

      activeCharts[elementId] = new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "15",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1", // Candlesticks
        "locale": "en",
        "toolbar_bg": "#131722",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "container_id": elementId,
        "studies": [
          "STD;SuperTrend",             // Automatically draws Buy/Sell signals on candles
          "STD;MA%1Cross",              // Moving Average Cross signals
          "STD;EMA"                     // Exponential Moving Average
        ]
      });
    }

    // Initialize View
    document.addEventListener("DOMContentLoaded", () => {
      renderChart("OANDA:XAUUSD", "tv_xauusd");
    });

    // Switch between assets
    function switchPair(pair, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.chart-wrapper').forEach(w => w.classList.remove('active'));

      if (pair === 'XAUUSD') {
        document.getElementById('wrapper-XAUUSD').classList.add('active');
        renderChart("OANDA:XAUUSD", "tv_xauusd");
      } else {
        document.getElementById('wrapper-BTCUSDT').classList.add('active');
        renderChart("BINANCE:BTCUSDT", "tv_btcusdt");
      }
    }
  </script>
</body>
</html>
