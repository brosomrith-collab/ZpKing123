<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAU/USD Trading Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      
      /* Smooth animated background gradient */
      background: linear-gradient(-45deg, #fff0f5, #ffd1dc, #ffe4e1, #ffffff);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      padding: 20px;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Terminal Container */
    .terminal-container {
      width: 100%;
      max-width: 1200px;
      height: 80vh;
      min-height: 600px;
      background: rgba(18, 18, 24, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(216, 27, 96, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar Header */
    .terminal-header {
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol-title {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
    }

    .symbol-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ffd700, #ffa500);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #121218;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .symbol-info h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .symbol-info span {
      font-size: 0.8rem;
      color: #a0a0ab;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #00e676;
      background: rgba(0, 230, 118, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 8px #00e676;
    }

    /* TradingView Container */
    .chart-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* Responsiveness */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .terminal-container { height: 88vh; border-radius: 14px; }
      .terminal-header { padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <!-- Header Bar -->
    <div class="terminal-header">
      <div class="symbol-title">
        <div class="symbol-icon">Au</div>
        <div class="symbol-info">
          <h2>XAU / USD</h2>
          <span>Gold Spot / US Dollar</span>
        </div>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Live Feed</span>
      </div>
    </div>

    <!-- Live Trading Chart Engine -->
    <div class="chart-wrapper">
      <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div id="tradingview_xauusd" style="height:calc(100% - 32px);width:100%"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_xauusd",
            "hide_side_toolbar": false,
            "studies": [
              "STD;RSI",
              "STD;MACD"
            ]
          });
        </script>
      </div>
    </div>
  </div>

</body>
</html>
